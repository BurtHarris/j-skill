name: Release

# Trigger on version tags (e.g. v0.1.0) pushed to the repository.
# Compiles binaries for all supported platforms and publishes a GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # Required to create a GitHub Release

jobs:
  # ── Compile ────────────────────────────────────────────────────────────────
  # A single Linux runner cross-compiles to every supported Deno target.
  compile:
    name: Compile binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: j-skill-linux-x64
          - target: aarch64-unknown-linux-gnu
            artifact: j-skill-linux-arm64
          - target: x86_64-pc-windows-msvc
            artifact: j-skill-windows-x64.exe
          - target: x86_64-apple-darwin
            artifact: j-skill-macos-x64
          - target: aarch64-apple-darwin
            artifact: j-skill-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Compile (${{ matrix.target }})
        run: |
          deno compile \
            --target ${{ matrix.target }} \
            --allow-read \
            --allow-write \
            --allow-env \
            --allow-run \
            --allow-net \
            --output dist/${{ matrix.artifact }} \
            src/cli.ts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  # ── Release ────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
